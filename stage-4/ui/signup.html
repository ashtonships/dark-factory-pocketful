<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#136C63">
<title>Create account · Pocketful</title>
<link rel="stylesheet" href="/ui/theme.css">
<script src="/ui/pocketful-core.js" defer></script>
<script src="/ui/app.js" defer></script>
</head>
<body data-page="signup">
<a class="skip" href="#main">Skip to content</a>
<header id="shell" class="topbar" hidden><div class="shell"><span class="brand">Pocketful</span></div></header>
<main id="main" class="page page-signup">
  <div class="auth-card">
    <div class="auth-brand"><span class="wordmark">Pocketful</span></div>
    <form class="auth-form form" novalidate>
      <h1>Create account</h1>
      <div class="field">
        <label for="signup-email">Email</label>
        <input id="signup-email" data-testid="signup-email" type="email" autocomplete="email" autocapitalize="none" placeholder="you@example.com" aria-describedby="signup-email-hint">
        <p class="field-hint" id="signup-email-hint">Your handle is made from the part before the @.</p>
      </div>
      <div class="field">
        <label for="signup-password">Password</label>
        <div class="password">
          <input id="signup-password" data-testid="signup-password" type="password" autocomplete="new-password" placeholder="At least 8 characters">
          <button type="button" class="password-toggle" data-password-toggle="signup-password" aria-label="Show password" aria-pressed="false"></button>
        </div>
      </div>
      <div class="field">
        <label for="signup-display-name">Display name</label>
        <input id="signup-display-name" data-testid="signup-display-name" autocomplete="name" placeholder="How should we call you?">
      </div>
      <button type="submit" class="button button-primary button-block" data-testid="signup-submit">Create account</button>
      <div id="auth-messages" class="messages" aria-live="polite"></div>
      <p class="switch">Already have an account? <a href="/login">Sign in</a></p>
    </form>
  </div>
</main>
</body>
</html>
