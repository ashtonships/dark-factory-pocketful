<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#136C63">
<title>Requests · Pocketful</title>
<link rel="stylesheet" href="/ui/theme.css">
<script src="/ui/pocketful-core.js" defer></script>
<script src="/ui/app.js" defer></script>
</head>
<body data-page="requests">
<a class="skip" href="#main">Skip to content</a>
<header id="shell" class="topbar"><div class="shell"><span class="brand">Pocketful</span></div></header>
<main id="main" class="page page-requests">
  <header class="page-head">
    <h1>Requests</h1>
    <p class="lede">Money requests from and to you.</p>
  </header>
  <div id="request-messages" class="messages page-messages" aria-live="polite"></div>
  <div id="requests-empty"></div>
  <div class="two-up">
    <section class="card" aria-labelledby="incoming-title">
      <div class="card-head"><h2 id="incoming-title">Incoming <span id="incoming-count" class="count"></span></h2><p class="card-sub">Requests from others to you.</p></div>
      <ul class="rows" data-testid="incoming-list"><li><div class="skeleton" role="status"><span class="sr-only">Loading…</span><div class="skeleton-row" aria-hidden="true"><span class="sk-dot"></span><span class="sk-lines"><span></span><span></span></span></div><div class="skeleton-row" aria-hidden="true"><span class="sk-dot"></span><span class="sk-lines"><span></span><span></span></span></div></div></li></ul>
    </section>
    <section class="card" aria-labelledby="outgoing-title">
      <div class="card-head"><h2 id="outgoing-title">Outgoing <span id="outgoing-count" class="count"></span></h2><p class="card-sub">Requests you've sent to others.</p></div>
      <ul class="rows" data-testid="outgoing-list"><li><div class="skeleton" role="status"><span class="sr-only">Loading…</span><div class="skeleton-row" aria-hidden="true"><span class="sk-dot"></span><span class="sk-lines"><span></span><span></span></span></div><div class="skeleton-row" aria-hidden="true"><span class="sk-dot"></span><span class="sk-lines"><span></span><span></span></span></div></div></li></ul>
    </section>
  </div>
</main>
</body>
</html>
