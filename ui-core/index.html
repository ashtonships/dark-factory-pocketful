<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallet · Pocketful</title>
<link rel="stylesheet" href="/ui/theme.css">
<script src="/ui/pocketful-core.js" defer></script>
<script src="/ui/app.js" defer></script>
</head>
<body data-page="index">
<header id="shell" class="topbar"><div class="shell"><span class="brand">Pocketful</span></div></header>
<main class="page">
  <section class="card wallet" aria-labelledby="wallet-title">
    <div class="card-head">
      <h1 id="wallet-title">Your wallet</h1>
      <button type="button" class="button button-quiet" data-testid="wallet-refresh">Refresh</button>
    </div>
    <div id="wallet" class="wallet-body"><p class="loading">Loading your balance…</p></div>
    <div id="refresh-status" class="messages" aria-live="polite"></div>
  </section>
  <div class="columns">
  <form class="card form" id="pay-form" novalidate>
    <h2>Send money</h2>
    <div class="field">
      <label for="pay-handle">To</label>
      <input id="pay-handle" data-testid="pay-handle" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="handle">
    </div>
    <div class="field">
      <label for="pay-amount" data-currency-label>Amount</label>
      <input id="pay-amount" data-testid="pay-amount" data-amount-input inputmode="decimal" autocomplete="off">
    </div>
    <div class="field">
      <label for="pay-note">Note <span class="optional">(optional)</span></label>
      <input id="pay-note" data-testid="pay-note" maxlength="200" autocomplete="off">
    </div>
    <div class="field">
      <label for="pay-visibility">Who can see it</label>
      <select id="pay-visibility" data-testid="pay-visibility">
        <option value="public">Public</option>
        <option value="private">Private (only the two of you)</option>
      </select>
    </div>
    <button type="submit" class="button button-primary" data-testid="pay-submit">Send</button>
    <div id="pay-messages" class="messages" aria-live="polite"></div>
  </form>
  <form class="card form" id="request-form" novalidate>
    <h2>Request money</h2>
    <div class="field">
      <label for="request-handle">From</label>
      <input id="request-handle" data-testid="request-handle" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="handle">
    </div>
    <div class="field">
      <label for="request-amount" data-currency-label>Amount</label>
      <input id="request-amount" data-testid="request-amount" data-amount-input inputmode="decimal" autocomplete="off">
    </div>
    <div class="field">
      <label for="request-note">Note <span class="optional">(optional)</span></label>
      <input id="request-note" data-testid="request-note" maxlength="200" autocomplete="off">
    </div>
    <button type="submit" class="button button-primary" data-testid="request-submit">Request</button>
    <div id="request-messages" class="messages" aria-live="polite"></div>
  </form>
  </div>
  <section class="card" aria-labelledby="activity-title">
    <h2 id="activity-title">Activity</h2>
    <div id="activity"><p class="loading">Loading activity…</p></div>
  </section>
</main>
</body>
</html>
